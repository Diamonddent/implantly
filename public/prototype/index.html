<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Implantly — Client Prototype</title>
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="../icons/icon-192.png">
<style>
:root{--bg:#0b0f17;--card:#111827;--card2:#0f1623;--bd:#1f2a3a;--tx:#e6edf6;--mut:#8b98ab;--pri:#36e2d4;--grad:linear-gradient(135deg,#36e2d4,#1ab3e6);--red:#f87171;--grn:#34d399;--amb:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.banner{background:#1a2333;color:var(--amb);text-align:center;font-size:12px;padding:6px 10px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:rgba(11,15,23,.95);backdrop-filter:blur(8px);z-index:20;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}.logo img{width:30px;height:30px;border-radius:8px}
.modes{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--bd)}
.modes button{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--mut)}
.modes button.on{background:var(--grad);color:#06121a;font-weight:600}
.sp{flex:1}
.btn{border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:#2d3b52}.btn.pri{background:var(--grad);border:0;color:#06121a;font-weight:600}.btn.sm{padding:5px 10px;font-size:12px}
.btn.dng{color:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}
.layout{display:flex;min-height:calc(100vh - 100px)}
nav.side{width:210px;border-inline-end:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav.side button{text-align:start;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--mut)}
nav.side button.on{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 0 var(--pri)}
[dir=rtl] nav.side button.on{box-shadow:inset -3px 0 0 var(--pri)}
main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}.mut{color:var(--mut)}.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.g2{grid-template-columns:1fr 1fr}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd)}
.b-g{color:var(--grn);border-color:#14532d;background:#052e1a}.b-a{color:var(--amb);border-color:#713f12;background:#2a1c05}.b-r{color:var(--red);border-color:#7f1d1d;background:#2a0a0a}.b-p{color:var(--pri);border-color:#115e59;background:#062a28}
.price{font-size:18px;font-weight:700}.old{text-decoration:line-through;color:var(--mut);font-size:12px;margin-inline-start:6px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font-size:18px;font-weight:700;border-top:1px solid var(--bd);padding-top:10px;margin-top:6px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:10px}.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer}.qty span{min-width:26px;text-align:center}
.steps{display:flex;gap:6px;margin-top:10px}.steps div{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:8px;background:var(--card2);color:var(--mut)}.steps div.done{background:#062a28;color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:720px;width:100%;max-height:90vh;overflow:auto}
.inv{background:#fff;color:#111;border-radius:12px;padding:20px}.inv th,.inv td{border-color:#ddd;color:#111}
.qr{width:96px;height:96px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/16px 16px;border:4px solid #111}
.bars{display:flex;flex-direction:column;gap:8px}.bar{display:flex;align-items:center;gap:8px}.bar .t{width:110px;font-size:12px;color:var(--mut)}.bar .f{height:18px;border-radius:6px;background:var(--grad)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:#052e1a;color:var(--grn);border:1px solid #14532d;padding:10px 16px;border-radius:12px;z-index:60}
[dir=rtl] .toast{transform:translateX(50%)}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:18px;text-align:center}
.up{color:var(--red)}.down{color:var(--grn)}
ul.clean{margin:6px 0;padding-inline-start:18px}ul.clean li{margin:4px 0}
@media(max-width:800px){nav.side{position:fixed;bottom:0;inset-inline:0;width:auto;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--bd);background:var(--bg);z-index:30;padding:6px}
nav.side button{white-space:nowrap;font-size:12px}main{padding:14px 12px 80px}.g2{grid-template-columns:1fr}.modes button{padding:6px 9px;font-size:12px}}
@media print{body *{visibility:hidden}.inv,.inv *{visibility:visible}.inv{position:absolute;inset:0}}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
  <div class="logo"><img src="../icons/icon-192.png" alt=""><span>Implantly</span></div>
  <div class="modes" id="modes"></div>
  <div class="sp"></div>
  <select id="clinicSel" title="clinic"></select>
  <button class="btn sm" id="langBtn"></button>
</header>
<div class="layout"><nav class="side" id="side"></nav><main id="main"></main></div>
<div id="modalRoot"></div>
<script>
// ---------- i18n ----------
const T={

catalog:"الكتالوج",kit:"طقم الحالة السريع",cart:"السلة",orders:"طلباتي",dashboard:"لوحة المعلومات",products:"المنتجات",prices:"رفع قائمة الأسعار",offers:"العروض والخصومات",aorders:"الطلبات",clinics:"العيادات",settings:"الإعدادات",
search:"ابحث بالاسم أو الرمز…",allBrands:"كل العلامات",allCats:"كل الفئات",add:"أضف إلى السلة",inStock:"متوفر",low:"مخزون منخفض",out:"غير متوفر",goldNote:"سعر عيادتك",

empty:"سلتك فارغة.",subtotal:"المجموع الفرعي",discounts:"الخصومات",vat:"ضريبة القيمة المضافة 15%",total:"الإجمالي",coupon:"رمز القسيمة",apply:"تطبيق",badCoupon:"القسيمة غير صالحة أو غير منطبقة",placeOrder:"تأكيد الطلب",placed:"تم إرسال الطلب",

sku:"الرمز",name:"الاسم",system:"النظام",category:"الفئة",price:"السعر (ر.س)",stock:"المخزون",active:"نشط",actions:"إجراءات",addProduct:"إضافة منتج",save:"حفظ",disable:"إيقاف",enable:"تفعيل",
uploadTitle:"ارفع قائمة أسعار (CSV) أو الصق أسطر الرمز,السعر",chooseFile:"اختر ملف CSV",preview:"معاينة",applyChanges:"تطبيق التغييرات",download:"تنزيل قائمة الأسعار الحالية (CSV)",oldP:"السعر القديم",newP:"السعر الجديد",change:"التغيير",unknown:"رمز غير معروف",
createOffer:"إنشاء عرض",offerName:"اسم العرض",type:"النوع",pct:"نسبة مئوية %",fixed:"مبلغ ثابت ر.س",bxgy:"اشترِ X واحصل على 1 مجاناً",value:"القيمة",appliesTo:"ينطبق على",wholeOrder:"الطلب كاملاً",start:"البداية",end:"النهاية",code:"رمز قسيمة (اختياري)",minOrder:"الحد الأدنى للطلب ر.س",forClinic:"لعيادة محددة فقط",any:"الكل",on:"مفعل",off:"متوقف",
courier:"شركة الشحن",tracking:"رقم التتبع",tier:"الفئة",special:"خصم خاص %",balance:"المستحق",company:"اسم الشركة",vatNo:"الرقم الضريبي",currency:"العملة",notify:"بريد الإشعارات",wa:"رقم واتساب",
seller:"البائع",buyer:"المشتري",qty:"الكمية",unit:"سعر الوحدة",lineTotal:"الإجمالي",zatca:"رمز الفاتورة الإلكترونية (زاتكا)",taxInvoice:"فاتورة ضريبية",free:"مجاني",saved:"تم الحفظ",kitFor:"طقم لـ"}};
const ST={Pending:"قيد الانتظار",Confirmed:"مؤكد",Processing:"قيد التجهيز",Shipped:"تم الشحن",Delivered:"تم التسليم",Cancelled:"ملغي"};
const CAT_AR={"Implant":"زرعة","Cover Screw":"برغي تغطية","Healing Abutment":"دعامة شفاء","Multi-Unit":"دعامة متعددة"};

// ---------- state ----------
const S={lang:"en",mode:"clinic",tab:"catalog",atab:"dashboard",admin:false,clinicId:1,q:"",fb:"",fc:"",cart:[],coupon:"",couponOk:null,
kit:{brand:"MegaGen",d:"4.0",l:"10"},preview:null,settings:{company:"Implantly Trading Co.",vat:"3XXXXXXXXXXXXX3",email:"orders@client.com",wa:"+966 5X XXX XXXX"},nextId:15,nextOffer:4};
const P=[
[1,"REF-M-ev42s-11","Astra Tech EV 4.2 S Ø4.2×11","Astra Tech","Astra EV","Implant",1069,40],
[2,"68010005","Cover Screw EV 4.2","Astra Tech","Astra EV","Cover Screw",169,120],
[3,"HA-M-2","Healing Abutment EV Ø4.0 H2","Astra Tech","Astra EV","Healing Abutment",206,60],
[4,"REF-NA-43-10","NobelActive 4.3 Ø4.3×10","Nobel Biocare","NobelActive","Implant",1069,25],
[5,"36647","Cover Screw NobelActive 3.0","Nobel Biocare","NobelActive","Cover Screw",169,80],
[6,"REF-BLX-RB-375-10","Straumann BLX RB Ø3.75×10","Straumann","BLX","Implant",1069,18],
[7,"064.4100S","BLX Closure Cap RB/WB H0","Straumann","BLX","Cover Screw",169,50],
[8,"REF-AR-R40-10","MegaGen AnyRidge Regular Ø4.0×10","MegaGen","AnyRidge","Implant",1069,55],
[9,"AANCSF4008","Cover Screw AnyRidge Ø4.0","MegaGen","AnyRidge","Cover Screw",169,140],
[10,"HA-R40-3.5","Healing Abutment AnyRidge Ø4.0 H3.5","MegaGen","AnyRidge","Healing Abutment",206,90],
[11,"REF-R40-10","ROOTT R Rootform Ø4.0×10","ROOTT","ROOTT R","Implant",731,3],
[12,"CS05","Cover Screw ROOTT R H0.5","ROOTT","ROOTT R","Cover Screw",98,0],
[13,"MUA-AR-17-2","Multi-Unit Abutment AnyRidge 17° H2","MegaGen","AnyRidge","Multi-Unit",450,30],
[14,"MUA-NA-0-2.5","Multi-Unit Abutment NobelActive straight H2.5","Nobel Biocare","NobelActive","Multi-Unit",520,12]
].map(([id,sku,name,brand,system,cat,price,stock])=>({id,sku,name,brand,system,cat,price,stock,active:true,sold:0}));
const C=[{id:1,name:"Al Noor Dental Center",tier:"Gold",disc:5,bal:4200},{id:2,name:"Riyadh Smile Clinic",tier:"Standard",disc:0,bal:0},{id:3,name:"Jeddah Implant Lab",tier:"Standard",disc:0,bal:1850}];
const O=[
{id:1,name:"MegaGen Week",type:"pct",value:10,scope:"brand",target:"MegaGen",start:"2026-11-26",end:"2026-12-10",code:"",min:0,clinic:0,on:true},
{id:2,name:"WELCOME50",type:"fixed",value:50,scope:"order",target:"",start:"2026-11-01",end:"2026-12-31",code:"WELCOME50",min:1000,clinic:0,on:true},
{id:3,name:"Buy 10 AnyRidge implants get 1 free",type:"bxgy",value:10,scope:"product",target:"REF-AR-R40-10",start:"2026-11-01",end:"2026-12-31",code:"",min:0,clinic:0,on:true}];
const ORD=[
{id:"MD-H64ICM",clinic:1,date:"2026-11-26",status:"Processing",lines:[{pid:8,qty:1,price:1069},{pid:9,qty:1,price:169},{pid:10,qty:1,price:206}],disc:0,courier:"",trk:""},
{id:"MD-PHFEZO",clinic:2,date:"2026-11-24",status:"Shipped",lines:[{pid:4,qty:2,price:1069},{pid:5,qty:2,price:169}],disc:0,courier:"SMSA",trk:"290011234"},
{id:"MD-TGV9RO",clinic:3,date:"2026-11-20",status:"Delivered",lines:[{pid:6,qty:1,price:1069},{pid:7,qty:1,price:169},{pid:13,qty:2,price:450}],disc:0,courier:"Aramex",trk:"AX77812"}];
ORD.forEach(o=>{o.lines.forEach(l=>{const p=pr(l.pid);if(p)p.sold+=l.qty});o.vat=round((sum(o.lines)-o.disc)*.15)});

// ---------- helpers ----------
function t(k){return T[S.lang][k]||k}
function sar(n){return (S.lang==="ar"?"ر.س ":"SAR ")+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function round(n){return Math.round(n*100)/100}
function pr(id){return P.find(p=>p.id===id)}
function sum(lines){return lines.reduce((s,l)=>s+l.qty*l.price,0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function clinic(){return C.find(c=>c.id===S.clinicId)}
function today(){return "2026-11-26"}
function live(o,cl){return o.on&&o.start<=today()&&o.end>=today()&&(!o.clinic||o.clinic===cl)}
function matches(o,p){return o.scope==="order"||(o.scope==="brand"&&p.brand===o.target)||(o.scope==="category"&&p.cat===o.target)||(o.scope==="product"&&p.sku===o.target)}
// unit price for a clinic after automatic % / fixed-per-item offers and clinic discount
function unitPrice(p,cl){let best=0;O.filter(o=>live(o,cl.id)&&!o.code&&o.scope!=="order"&&matches(o,p)).forEach(o=>{if(o.type==="pct")best=Math.max(best,p.price*o.value/100);if(o.type==="fixed")best=Math.max(best,Math.min(o.value,p.price))});
 let u=p.price-best;if(cl.disc)u=u*(1-cl.disc/100);return round(u)}
function cartCalc(){const cl=clinic();const lines=S.cart.map(c=>{const p=pr(c.pid);return{p,qty:c.qty,unit:unitPrice(p,cl)}});
 let sub=lines.reduce((s,l)=>s+l.unit*l.qty,0),listSub=lines.reduce((s,l)=>s+l.p.price*l.qty,0);const notes=[];const freeLines=[];
 if(listSub>sub)notes.push([S.lang==="ar"?"عروض تلقائية وخصم العيادة":"Automatic offers & clinic discount",listSub-sub]);
 O.filter(o=>live(o,cl.id)&&o.type==="bxgy").forEach(o=>{lines.filter(l=>matches(o,l.p)).forEach(l=>{const f=Math.floor(l.qty/o.value);if(f>0)freeLines.push({p:l.p,qty:f})})});
 let cdisc=0;if(S.coupon){const o=O.find(o=>o.code&&o.code.toUpperCase()===S.coupon.toUpperCase()&&live(o,cl.id));
  if(o&&sub>=o.min){const base=o.scope==="order"?sub:lines.filter(l=>matches(o,l.p)).reduce((s,l)=>s+l.unit*l.qty,0);cdisc=o.type==="pct"?base*o.value/100:Math.min(o.value,base);S.couponOk=true;notes.push([o.name,cdisc])}else S.couponOk=false}
 O.filter(o=>live(o,cl.id)&&!o.code&&o.scope==="order"&&o.type!=="bxgy"&&sub>=o.min).forEach(o=>{const d=o.type==="pct"?sub*o.value/100:o.value;cdisc+=d;notes.push([o.name,d])});
 const net=Math.max(0,sub-cdisc),vat=round(net*.15);return{lines,freeLines,listSub,sub,cdisc,notes,net,vat,total:round(net+vat),totalDisc:round(listSub-sub+cdisc)}}
function stockBadge(p){return p.stock<=0?`<span class="badge b-r">${t("out")}</span>`:p.stock<=5?`<span class="badge b-a">${t("low")} · ${p.stock}</span>`:`<span class="badge b-g">${t("inStock")}</span>`}
function catName(c){return S.lang==="ar"?(CAT_AR[c]||c):c}
function stName(s){return S.lang==="ar"?ST[s]:s}
function stBadge(s){const m={Pending:"b-a",Confirmed:"b-p",Processing:"b-p",Shipped:"b-p",Delivered:"b-g",Cancelled:"b-r"};return `<span class="badge ${m[s]}">${stName(s)}</span>`}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function orderTotal(o){const net=sum(o.lines)-o.disc;return round(net+net*.15)}
function go(k,v){S[k]=v;render()}

// ---------- render ----------
function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 banner.textContent=t("banner");langBtn.textContent=t("lang");
 modes.innerHTML=["clinic","admin","plan"].map(m=>`<button class="${S.mode===m?"on":""}" onclick="go('mode','${m}')">${t(m)}</button>`).join("");
 clinicSel.style.display=S.mode==="clinic"?"":"none";
 clinicSel.innerHTML=C.map(c=>`<option value="${c.id}" ${c.id===S.clinicId?"selected":""}>${esc(c.name)}</option>`).join("");
 let tabs=[];if(S.mode==="clinic")tabs=["catalog","kit","cart","orders"];else if(S.mode==="admin"&&S.admin)tabs=["dashboard","products","prices","offers","aorders","clinics","settings"];
 const cur=S.mode==="clinic"?S.tab:S.atab;
 side.style.display=tabs.length?"":"none";
 side.innerHTML=tabs.map(k=>`<button class="${cur===k?"on":""}" onclick="go('${S.mode==="clinic"?"tab":"atab"}','${k}')">${t(k)}${k==="cart"&&S.cart.length?` (${S.cart.reduce((s,c)=>s+c.qty,0)})`:""}</button>`).join("");
 let h="";
 if(S.mode==="plan")h=vPlan();

function addOffer(){const g=id=>document.getElementById(id).value;O.push({id:S.nextOffer++,name:g("of_name")||"Offer",type:g("of_type"),value:+g("of_val"),scope:g("of_scope"),target:g("of_scope")==="order"?"":g("of_target"),start:g("of_s"),end:g("of_e"),code:g("of_code").trim().toUpperCase(),min:+g("of_min")||0,clinic:+g("of_cl"),on:true});render();toast(t("saved"))}
function vAOrders(){return `<h1>${t("aorders")}</h1><div class="row" style="margin:12px 0"><select onchange="S.fs=this.value;render()"><option value="">${t("any")}</option>${["Pending","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(s=>`<option value="${s}" ${S.fs===s?"selected":""}>${stName(s)}</option>`).join("")}</select></div>
 <div class="card tw">${ordTable(ORD.filter(o=>!S.fs||o.status===S.fs),true)}</div>`}
function vClinics(){return `<h1>${t("clinics")}</h1><div class="card tw" style="margin-top:12px"><table><tr><th>${t("name")}</th><th>${t("tier")}</th><th>${t("special")}</th><th>${t("ordersN")}</th><th>${t("balance")}</th></tr>
 ${C.map(c=>`<tr><td>${esc(c.name)}</td><td><select onchange="C.find(x=>x.id===${c.id}).tier=this.value;toast(t('saved'))">${["Standard","Silver","Gold"].map(x=>`<option ${c.tier===x?"selected":""}>${x}</option>`).join("")}</select></td>
 <td><input type="number" value="${c.disc}" style="width:70px" onchange="C.find(x=>x.id===${c.id}).disc=+this.value;toast(t('saved'))"></td><td>${ORD.filter(o=>o.clinic===c.id).length}</td><td>${sar(c.bal)}</td></tr>`).join("")}</table></div>`}
function vSettings(){const s=S.settings;return `<h1>${t("settings")}</h1><div class="card grid" style="margin-top:12px;max-width:520px">
 <label>${t("company")}<input value="${esc(s.company)}" onchange="S.settings.company=this.value"></label><label>${t("vatNo")}<input value="${esc(s.vat)}" onchange="S.settings.vat=this.value"></label>
 <label>${t("vat")}<input value="15%" disabled></label><label>${t("currency")}<input value="SAR" disabled></label>
 <label>${t("notify")}<input value="${esc(s.email)}" onchange="S.settings.email=this.value"></label><label>${t("wa")}<input value="${esc(s.wa)}" onchange="S.settings.wa=this.value"></label>
 <button class="btn pri" onclick="toast(t('saved'))">${t("save")}</button></div>`}

 <li><b>Supabase Pro</b> — USD 25/${ar?"شهر":"month"}: ${ar?"قاعدة بيانات 8 GB، 100,000 مستخدم نشط شهرياً، 250 GB نقل بيانات، نسخ احتياطي يومي، لا يتوقف أبداً":"8 GB database, 100,000 monthly active users, 250 GB egress, daily backups, never paused"}</li>

 <div class="card"><h2>${ar?"المراحل":"Phases"}</h2><ol class="clean">

 <div class="card" style="grid-column:1/-1"><h2>${ar?"أسئلة للعميل":"Questions for the client"}</h2><ul class="clean">
